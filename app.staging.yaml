# Staging environment configuration
runtime: nodejs20

service: control-desk-web-staging

env: standard

instance_class: F1

automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: 'staging'
  VITE_API_BASE_URL: 'https://staging-api.example.com/api'

handlers:
  - url: /.*
    secure: always
    script: auto
