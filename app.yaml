runtime: nodejs22

service: control-desk-web

env: standard

instance_class: F1

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: 'production'
  BASE_PATH: '/control-desk-web'
  VITE_API_URL: '/onboarding'

handlers:
  - url: /.*
    secure: always
    script: auto
