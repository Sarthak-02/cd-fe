# Cloud Build configuration for GCP App Engine deployment
# This file is used by Cloud Build for automated deployments

steps:
  # Install dependencies
  - name: 'node:22'
    entrypoint: npm
    args: ['ci']
    
  # Run linting
  - name: 'node:22'
    entrypoint: npm
    args: ['run', 'lint']
    
  # Build the application
  - name: 'node:22'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'NODE_ENV=production'
    
  # Deploy to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.yaml', '--quiet', '--service=control-desk-web']

# Build timeout
timeout: '1200s'

# Store build logs
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
