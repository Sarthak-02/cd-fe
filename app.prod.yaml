# Production environment configuration
runtime: nodejs22

service: control-desk-web

env: standard

instance_class: F2  # Larger instance for production

automatic_scaling:
  min_instances: 2  # Always keep 2 instances running
  max_instances: 10
  target_cpu_utilization: 0.65
  min_pending_latency: 30ms
  max_pending_latency: 100ms

env_variables:
  NODE_ENV: 'production'
  BASE_PATH: '/control-desk-web'

handlers:
  - url: /.*
    secure: always
    redirect_http_response_code: 301
    script: auto

# Health check configuration
readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
