# Development environment configuration
runtime: nodejs22

service: control-desk-web-dev

env: standard

instance_class: F1

automatic_scaling:
  min_instances: 0  # Save costs in dev
  max_instances: 2
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: 'development'
  VITE_API_BASE_URL: 'https://dev-api.example.com/api'

handlers:
  - url: /.*
    secure: always
    script: auto
